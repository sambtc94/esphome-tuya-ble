substitutions:
  device_name: restmo-water-meter
  friendly_name: Restmo Water Meter

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32cam
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password2
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/pcr20/esphome-tuya-ble
      ref: main
    components: [tuya_ble_client, tuya_ble_node, tuya_ble_tracker]

esp32_ble_tracker:

tuya_ble_tracker:

tuya_ble_client:
  - id: tuya_client

tuya_ble_node:
  - id: restmo_node
    mac_address: !secret restmo_mac_address
    local_key: !secret restmo_local_key
    device_id: !secret restmo_device_id
    uuid: !secret restmo_uuid
    tuya_ble_client_id: tuya_client

tuya_ble_node.sensor:
  - tuya_ble_node_id: restmo_node
    sensors:
      # DP 1 — water_use_data: cumulative total (unit 0.1 L → scale 0.1)
      - dp_id: 1
        scale: 0.1
        sensor:
          name: "Water Total"
          unit_of_measurement: "L"
          accuracy_decimals: 1
          device_class: water
          state_class: total_increasing
          icon: mdi:counter

      # DP 2 — water_once: session usage (unit 0.1 L → scale 0.1)
      - dp_id: 2
        scale: 0.1
        sensor:
          name: "Water Session"
          unit_of_measurement: "L"
          accuracy_decimals: 1
          device_class: water
          state_class: measurement
          icon: mdi:water

      # DP 4 — voltage_current: battery level (unit %)
      - dp_id: 4
        scale: 1.0
        sensor:
          name: "Battery Level"
          unit_of_measurement: "%"
          accuracy_decimals: 0
          device_class: battery
          state_class: measurement
          icon: mdi:battery

      # DP 5 — flow_velocity: live flow rate (unit 0.1 L/min → scale 0.1)
      - dp_id: 5
        scale: 0.1
        sensor:
          name: "Water Flow Rate"
          unit_of_measurement: "L/min"
          accuracy_decimals: 1
          device_class: water
          state_class: measurement
          icon: mdi:water-pump
